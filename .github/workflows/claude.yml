name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: sudo apt-get update -y && sudo apt-get install -y ffmpeg

      # The ~1GB voice/word-timing models (kit/models), the npm/Playwright
      # install (kit/node_modules + Playwright's own browser cache) and the
      # Python voice venv (kit/.venv) are all idempotent - kit/setup.sh
      # already skips anything that's already on disk. Restoring them here,
      # before Claude's turn runs setup.sh, means only the very first run
      # (or a run after setup.sh changes) ever pays that download again.
      - name: Cache animation-skill models & deps
        uses: actions/cache@v4
        with:
          path: |
            kit/node_modules
            kit/.venv
            kit/models
            kit/vendor
            ~/.cache/ms-playwright
          key: anim-kit-${{ hashFiles('kit/setup.sh', 'kit/package-lock.json') }}
          restore-keys: |
            anim-kit-

      - uses: anthropics/claude-code-action@v1.0.206
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --allowedTools "Bash,Write,Edit,Read,Glob,Grep,LS"
          # TEMPORARY: keeping full output on for one more confirmation run
          # after the .claude/skills/ fix below, then removing.
          show_full_output: true

      # Adds the corner channel bug over the opening hook + a FOLLOW outro card
      # to whatever output.mp4 the step above produced. Never touches the hook
      # itself - see kit/post/add_intro_outro.sh for why it's built this way.
      - name: Add intro bug + outro CTA
        if: always()
        continue-on-error: true
        run: |
          if [ -f output.mp4 ]; then
            pip install --quiet --break-system-packages pillow numpy soundfile scipy
            bash kit/post/add_intro_outro.sh output.mp4 output_final.mp4 \
              "${{ vars.CHANNEL_HANDLE || '@yourhandle' }}" \
              "${{ vars.CHANNEL_CTA || 'FOR MORE' }}"
          fi

      - name: Upload rendered video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render
          path: output_final.mp4
          if-no-files-found: ignore

      - name: Upload raw render (fallback, no intro/outro)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-raw
          path: output.mp4
          if-no-files-found: ignore
